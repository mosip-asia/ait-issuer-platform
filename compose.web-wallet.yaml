# ==============================================================================
# Inji Web Wallet UI Compose Manifest
# ==============================================================================
# Isolated Stack:
# - Inji Web Wallet UI (port 4004)
#
# Network: wallet-network (isolated)
# Integration: Proxies /v1/mimoto to VCGA via trust-network
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME}-web-wallet

networks:
  wallet-network:
    name: ${COMPOSE_PROJECT_NAME}-wallet-net
  trust-network:
    name: ${COMPOSE_PROJECT_NAME}-trust-net

services:
  inji-web:
    image: injistack/inji-web:0.16.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vdr.localhost:host-gateway"
      - "vcga.localhost:host-gateway"
      - "issuer.localhost:host-gateway"
      - "verifier.localhost:host-gateway"
      - "wallet.localhost:host-gateway"
      - "auth.localhost:host-gateway"
      - "vdr.dpi.ait.ac.th:host-gateway"
      - "vcga.dpi.ait.ac.th:host-gateway"
      - "issuer.dpi.ait.ac.th:host-gateway"
      - "verifier.dpi.ait.ac.th:host-gateway"
      - "verifer.dpi.ait.ac.th:host-gateway"
      - "wallet.dpi.ait.ac.th:host-gateway"
    environment:
      - DEFAULT_LANG=en
      - MIMOTO_URL=${INJI_WEB_URL}/v1/mimoto
      - TRUSTED_VCGA_URLS=${TRUSTED_VCGA_URLS:-http://vcga.localhost}
    volumes:
      - ./deploy/base/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wallet.rule=Host(`wallet.localhost`) || Host(`wallet.lan`) || Host(`wallet.dpi.ait.ac.th`)"
      - "traefik.http.services.wallet.loadbalancer.server.port=3004"
    networks:
      wallet-network:
        aliases:
          - inji-web
          - wallet.dpi.ait.ac.th
          - wallet
      trust-network: {}
