# ==============================================================================
# Inji Web Wallet & Mimoto Stack Compose Manifest
# ==============================================================================
# Isolated Stack:
# - Inji Web Wallet UI (port 4004)
# - Mimoto Identity/Wallet Mediator (port 9099)
# - PostgreSQL database (inji_mimoto)
#
# Network: wallet-network (isolated)
# Integration: Connects to Auth Server and Certify via external URLs/host ports
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME}

networks:
  wallet-network:
    name: ${COMPOSE_PROJECT_NAME}_wallet-net

services:
  wallet-database:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./deploy/local/mimoto_init.sql:/docker-entrypoint-initdb.d/mimoto_init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "inji_mimoto"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks:
      - wallet-network

  mimoto-service:
    image: injistack/mimoto:0.21.0
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9099:8099"
    environment:
      - container_user=mosip
      - active_profile_env=default
      - SPRING_CONFIG_NAME=mimoto
      - SPRING_CONFIG_LOCATION=/home/mosip/
      - SPRING_CLOUD_BOOTSTRAP_LOCATION=/home/mosip/mimoto-bootstrap.properties
      - oidc_p12_password=xy4gh6swa2i
      - WALLET_BINDING_PARTNER_API_KEY=dummywalletbindingpartnerapikey
      - SPRING_DATASOURCE_URL=jdbc:postgresql://wallet-database:5432/inji_mimoto
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - GOOGLE_OAUTH_CLIENT_ID=clientId
      - GOOGLE_OAUTH_CLIENT_SECRET=clientSecret
      - SPRING_CLOUD_LOADBALANCER_ENABLED=false
      - SPRING_CLOUD_DISCOVERY_ENABLED=false
      - KEYCLOAK_EXTERNAL_URL=${KEYCLOAK_PUBLIC_BASE_URL:-http://localhost:9080}
      - MOSIP_INJI_WEB_URL=${INJI_WEB_URL:-http://localhost:4004}
      - MOSIP_SECURITY_ORIGINS=${INJI_WEB_URL:-http://localhost:4004}
    volumes:
      - ./deploy/local/mimoto-default.properties:/home/mosip/mimoto-default.properties
      - ./deploy/local/mimoto-bootstrap.properties:/home/mosip/mimoto-bootstrap.properties
      - ./deploy/${INSTALLATION}/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json
      - ./deploy/local/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json
    depends_on:
      wallet-database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wallet-network

  inji-web:
    image: injistack/inji-web:0.16.0
    ports:
      - "4004:3004"
    environment:
      - DEFAULT_LANG=en
      - MIMOTO_URL=${INJI_WEB_URL:-http://localhost:4004}/v1/mimoto
    volumes:
      - ./deploy/local/mimoto-default.properties:/home/mosip/mimoto-default.properties
      - ./deploy/${INSTALLATION}/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json
      - ./deploy/local/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json
      - ./deploy/base/credential-template.html:/home/mosip/credential-template.html
      - ./deploy/local/AITUniversity-ait-transcript-template.html:/home/mosip/AITUniversity-ait-transcript-template.html
      - ./deploy/base/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - mimoto-service
    networks:
      - wallet-network
