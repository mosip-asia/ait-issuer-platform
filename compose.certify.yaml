# ==============================================================================
# Inji Certify Issuer Engine Compose Manifest
# ==============================================================================
# Isolated Stack:
# - Inji Certify with compiled SPI JAR mounted as plugin (internal port 8090)
# - Ingress Nginx (port 9091 / port 80 Traefik upstream)
# - GitOps Template-Sync
#
# Network: certify-network (isolated)
# Database: Provided by compose.database.yaml (database:5432)
# Integration: External via CERTIFY_PUBLIC_BASE_URL (http://localhost:9091)
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME}-certify

networks:
  certify-network:
    name: ${COMPOSE_PROJECT_NAME}-certify-net

services:
  certify:
    build:
      context: .
      dockerfile: docker/Dockerfile.certify
    image: ${CERTIFY_IMAGE:-ghcr.io/mosip-asia/ait-certify:${IMAGE_TAG}}
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vdr.localhost:host-gateway"
      - "vcga.localhost:host-gateway"
      - "issuer.localhost:host-gateway"
      - "verifier.localhost:host-gateway"
      - "wallet.localhost:host-gateway"
      - "auth.localhost:host-gateway"
      - "adapter.localhost:host-gateway"
      - "gateway.localhost:host-gateway"
    environment:
      - active_profile_env=default, installation
      - AUTH_SERVER_ISSUER=${AUTH_SERVER_ISSUER}
      - AUTH_SERVER_JWKS_URL=${AUTH_SERVER_JWKS_URL}
      - CERTIFY_DID=${CERTIFY_DID}
      - CERTIFY_RECORD_URL=${CERTIFY_RECORD_URL}
      - container_user=mosip
      - download_hsm_client=false
      - enable_certify_artifactory=false
      - KEYSTORE_TYPE=${KEYSTORE_TYPE}
      - KEYSTORE_PASS=${KEYSTORE_PASS}
      - MOSIP_CERTIFY_GATEWAY_ENABLED=${MOSIP_CERTIFY_GATEWAY_ENABLED}
      - MOSIP_CERTIFY_GATEWAY_URL=${MOSIP_CERTIFY_GATEWAY_URL}
      - mosip_certify_domain_url=${CERTIFY_PUBLIC_BASE_URL}
      - SPRING_CONFIG_LOCATION=/home/mosip/config/
      - SPRING_CONFIG_NAME=certify
    volumes:
      - ./deploy/base/certify-default.properties:/home/mosip/config/certify-default.properties
      - ./deploy/${INSTALLATION}/certify/certify-installation.properties:/home/mosip/config/certify-installation.properties
      - ./deploy/${INSTALLATION}/private_key/CERTIFY_PKCS12:/home/inji/CERTIFY_PKCS12
      - ./deploy/${INSTALLATION}/certify/vp_request_config.json:/home/mosip/config/vp_request_config.json
    depends_on:
      database:
        condition: service_healthy
      template-sync:
        condition: service_completed_successfully
    networks:
      certify-network:
        aliases:
          - certify
          - service

  nginx:
    image: nginx:stable
    restart: unless-stopped
    volumes:
      - ./deploy/base/certify-nginx.conf:/etc/nginx/conf.d/default.conf
      - ./deploy/${INSTALLATION}/certify/vp_request_config.json:/config/server/vp_request_config.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.certify.rule=${TRAEFIK_CERTIFY_RULE}"
      - "traefik.http.services.certify.loadbalancer.server.port=80"
    depends_on:
      - certify
    networks:
      certify-network:
        aliases:
          - certify-nginx
          - issuer

  template-sync:
    build:
      context: .
      dockerfile: docker/Dockerfile.template-sync
    image: ${TEMPLATE_SYNC_IMAGE:-ghcr.io/mosip-asia/ait-certify-template-sync:${IMAGE_TAG}}
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./deploy/${INSTALLATION}/certify/credentials:/app/config/credentials:ro
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=inji_certify
      - VDR_BASE_URL=${VDR_BASE_URL}
    networks:
      - certify-network
