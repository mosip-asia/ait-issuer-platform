# ==============================================================================
# Inji Certify Issuer Engine Compose Manifest
# ==============================================================================
# Isolated Stack:
# - Inji Certify with compiled SPI JAR mounted as plugin (internal port 8090)
# - PostgreSQL database (inji_certify, internal port 5432)
# - Ingress Nginx (port 9091)
# - GitOps Template-Sync
#
# Network: certify-network (isolated)
# Integration: External via CERTIFY_PUBLIC_BASE_URL (http://localhost:9091)
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME}-certify

networks:
  certify-network:
    name: ${COMPOSE_PROJECT_NAME}-certify-net

services:
  database:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/base/certify_init.sql:/docker-entrypoint-initdb.d/01_certify_init.sql
      - issuer-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER}", "-d", "inji_certify"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks:
      - certify-network

  service:
    image: injistack/inji-certify-with-plugins:0.14.0
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vdr.dpi.ait.ac.th:host-gateway"
      - "cdn.dpi.ait.ac.th:host-gateway"
      - "vcga.dpi.ait.ac.th:host-gateway"
      - "issuer.dpi.ait.ac.th:host-gateway"
      - "verifier.dpi.ait.ac.th:host-gateway"
      - "verifer.dpi.ait.ac.th:host-gateway"
      - "wallet.dpi.ait.ac.th:host-gateway"
    environment:
      - active_profile_env=default, installation
      - AUTH_SERVER_ISSUER=${AUTH_SERVER_ISSUER}
      - AUTH_SERVER_JWKS_URL=${AUTH_SERVER_JWKS_URL}
      - AUTH_SERVER_WALLET_CLIENT_ID=${AUTH_SERVER_WALLET_CLIENT_ID}
      - CERTIFY_DID=${CERTIFY_DID}
      - CERTIFY_RECORD_URL=${CERTIFY_RECORD_URL}
      - container_user=mosip
      - download_hsm_client=false
      - enable_certify_artifactory=false
      - MOSIP_CERTIFY_GATEWAY_ENABLED=${MOSIP_CERTIFY_GATEWAY_ENABLED}
      - MOSIP_CERTIFY_GATEWAY_URL=${MOSIP_CERTIFY_GATEWAY_URL}
      - mosip_certify_domain_url=${CERTIFY_PUBLIC_BASE_URL}
      - SPRING_CONFIG_LOCATION=/home/mosip/config/
      - SPRING_CONFIG_NAME=certify
    volumes:
      - type: bind
        source: ./src/issuer/target/issuer-data-provider-plugin.jar
        target: /home/inji/additional_jars/issuer-data-provider-plugin.jar
        read_only: true
        bind:
          create_host_path: false
      - ./deploy/base/certify-default.properties:/home/mosip/config/certify-default.properties
      - ./deploy/${INSTALLATION}/certify-installation.properties:/home/mosip/config/certify-installation.properties
      - ./deploy/${INSTALLATION}/private_key/CERTIFY_PKCS12:/home/inji/CERTIFY_PKCS12
      - ./deploy/${INSTALLATION}/vp_request_config.json:/home/mosip/config/vp_request_config.json
    depends_on:
      database:
        condition: service_healthy
      template-sync:
        condition: service_completed_successfully
    networks:
      certify-network:
        aliases:
          - certify

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "${CERTIFY_PORT}:80"
    volumes:
      - ./deploy/base/certify-nginx.conf:/etc/nginx/conf.d/default.conf
      - ./deploy/${INSTALLATION}/vp_request_config.json:/config/server/vp_request_config.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.certify.rule=Host(`issuer.localhost`) || Host(`issuer.lan`) || Host(`issuer.dpi.ait.ac.th`)"
      - "traefik.http.services.certify.loadbalancer.server.port=80"
    depends_on:
      - service
    networks:
      certify-network:
        aliases:
          - certify-nginx
          - issuer.dpi.ait.ac.th
          - issuer

  template-sync:
    build:
      context: .
      dockerfile: docker/Dockerfile.template-sync
    image: ghcr.io/mosip-asia/certify-template-sync:local
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./deploy/${INSTALLATION}/credentials:/app/config/credentials:ro
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=inji_certify
      - VDR_BASE_URL=${VDR_BASE_URL}
      - CDN_BASE_URL=${CDN_BASE_URL}
    networks:
      - certify-network

volumes:
  issuer-db:
    name: ${COMPOSE_PROJECT_NAME}_issuer-db_${INSTALLATION}
