# ==============================================================================
# Inji Verifiable Credential Platform - Root Manifest
# ==============================================================================
# Orchestrates the modular platform components:
# 1. Inji Certify Engine     (compose.certify.yaml)
# 2. Inji Verifier Stack     (compose.verify.yaml)
# 3. Inji Web Wallet UI      (compose.web-wallet.yaml)
# 4. Trust Registry (VDR/VCGA)(compose.trust.yaml)
#
# For local development with stand-in mock dependencies (Keycloak & Mock SIS):
#   docker compose -f compose.yaml -f compose.mock.yaml up -d
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME}

include:
  - compose.certify.yaml
  - compose.verify.yaml
  - compose.web-wallet.yaml
  - compose.trust.yaml
  - compose.traefik.yaml

services:
  vc-lab:
    build:
      context: .
      dockerfile: docker/Dockerfile.vc-lab
    container_name: vc-lab
    ports:
      - "${VC_LAB_PORT}:4200"
    environment:
      - INSTALLATION=${INSTALLATION}
      - CREDENTIALS_DIR=/app/credentials
      - CONTEXTS_DIR=/app/contexts
      - ASSETS_DIR=/app/assets
      - TEMPLATES_DIR=/app/templates
      - BASE_TEMPLATES_DIR=/app/base_templates
    volumes:
      - ./deploy/${INSTALLATION}/credentials:/app/credentials:ro
      - ./deploy/${INSTALLATION}/contexts:/app/contexts:ro
      - ./deploy/${INSTALLATION}/assets:/app/assets:ro
      - ./deploy/${INSTALLATION}:/app/templates:ro
      - ./deploy/base:/app/base_templates:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vclab.rule=Host(`lab.localhost`) || Host(`vclab.localhost`) || Host(`lab.lan`) || Host(`lab.dpi.ait.ac.th`)"
      - "traefik.http.services.vclab.loadbalancer.server.port=4200"
