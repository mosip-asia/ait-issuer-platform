# ==============================================================================
# Inji Verifiable Credential Platform - Root Manifest
# ==============================================================================
# Orchestrates the modular platform components:
# 1. Platform Database       (compose.database.yaml)
# 2. Inji Certify Engine     (compose.certify.yaml)
# 3. Inji Verifier Stack     (compose.verify.yaml)
# 4. Inji Web Wallet UI      (compose.web-wallet.yaml)
# 5. Trust Registry (VDR/VCGA)(compose.trust.yaml)
# 6. Traefik Ingress Router  (compose.traefik.yaml)
#
# For local development with stand-in mock dependencies (Keycloak & Mock SIS):
#   docker compose -f compose.yaml -f compose.mock.yaml up -d
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME}

include:
  - compose.database.yaml
  - compose.certify.yaml
  - compose.verify.yaml
  - compose.web-wallet.yaml
  - compose.trust.yaml
  - compose.traefik.yaml

services:
  vc-lab:
    build:
      context: .
      dockerfile: docker/Dockerfile.ait-vc
    image: ghcr.io/mosip-asia/ait-vc:${IMAGE_TAG}
    command: ["python", "src/vc-lab/main.py"]
    container_name: vc-lab
    environment:
      - INSTALLATION=${INSTALLATION}
      - CREDENTIALS_DIR=/app/credentials
      - CONTEXTS_DIR=/app/vdr/contexts
      - ASSETS_DIR=/app/vdr/assets
      - TEMPLATES_DIR=/app/vdr/templates
      - BASE_TEMPLATES_DIR=/app/base_templates
    volumes:
      - ./deploy/${INSTALLATION}/certify/credentials:/app/credentials:ro
      - ./deploy/${INSTALLATION}/vdr/contexts:/app/vdr/contexts:ro
      - ./deploy/${INSTALLATION}/vdr/assets:/app/vdr/assets:ro
      - ./deploy/${INSTALLATION}/vdr/templates:/app/vdr/templates:ro
      - ./deploy/base/vdr/templates:/app/base_templates:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vclab.rule=${TRAEFIK_VCLAB_RULE}"
      - "traefik.http.services.vclab.loadbalancer.server.port=4200"
