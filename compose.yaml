# ==============================================================================
# Inji Verifiable Credential Platform - Root Manifest
# ==============================================================================
# Orchestrates the core production-ready components:
# 1. Inji Certify Engine     (compose.certify.yaml)
# 2. Inji Verifier Stack     (compose.verifier.yaml)
# 3. Inji Web Wallet         (compose.web-wallet.yaml)
#
# For local development with stand-in mock dependencies (Keycloak & Mock SIS):
#   docker compose -f compose.yaml -f compose.local.yaml up -d
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME}

include:
  - compose.certify.yaml
  - compose.verifier.yaml
  - compose.web-wallet.yaml
