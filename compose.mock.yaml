# ==============================================================================
# Offline Development & Stand-in Mock Services Stack
# ==============================================================================
# Isolated Stack for Offline Testing & Stand-in Dependencies:
# - Stand-in Keycloak OAuth Server & Nginx (port 9080)
# - Stand-in SIS Mock Adapter (port 8082)
# - Approval Gateway (port 8000)
# - Demo Portal (Registrar & Student UI) (port 4100)
#
# Network: mock-network (isolated)
# Integration: Bridges to Certify/Wallet via host ports / host.docker.internal
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME}-mock

networks:
  mock-network:
    name: ${COMPOSE_PROJECT_NAME}-mock-net

services:
  keycloak-server:
    image: quay.io/keycloak/keycloak:24.0
    command:
      [
        "start-dev",
        "--import-realm",
        "--hostname-strict=true",
        "--hostname-url=${KEYCLOAK_DOCKER_AUTH_SERVER}",
        "--hostname-port=9080",
        "--hostname-admin-url=${KEYCLOAK_PUBLIC_BASE_URL}",
        "--proxy=edge",
        "--proxy-headers=xforwarded",
      ]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./deploy/${INSTALLATION}/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    networks:
      - mock-network

  keycloak:
    image: nginx:stable
    ports:
      - "9080:8080"
    environment:
      - KEYCLOAK_PUBLIC_BASE_URL=${KEYCLOAK_PUBLIC_BASE_URL}
    volumes:
      - ./deploy/local/keycloak-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - keycloak-server
    restart: unless-stopped
    networks:
      - mock-network

  demo-app:
    build:
      context: .
      dockerfile: src/portal/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4100:4100"
    environment:
      - AIT_DEMO_DB=/demo/.demo-state/demo_requests.db
      - INJI_WEB_URL=${INJI_WEB_URL}
      - INJI_VERIFY_URL=${INJI_VERIFY_URL}
      - CERTIFY_PUBLIC_BASE_URL=${CERTIFY_PUBLIC_BASE_URL}
      - INSTALLATION=${INSTALLATION}
    env_file:
      - ./deploy/${INSTALLATION}/authorization-server.env
    volumes:
      - ./src/portal:/demo/src/portal
      - ./scripts:/demo/scripts
      - ./deploy:/demo/deploy
      - ./tests/fixtures:/demo/tests/fixtures:ro
    networks:
      - mock-network

  gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    env_file:
      - ./deploy/${INSTALLATION}/gateway.env
    restart: unless-stopped
    networks:
      - mock-network

  adapter:
    build:
      context: .
      dockerfile: mock/adapter/Dockerfile
    ports:
      - "8082:8000"
    environment:
      - ADAPTER_CSV=/data/student_identity_data.csv
    volumes:
      - ./deploy/${INSTALLATION}/adapter:/data:ro
    restart: unless-stopped
    networks:
      - mock-network
