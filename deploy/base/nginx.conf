# Defer upstream DNS to request time so nginx starts even when `vcga` is not on Docker DNS yet
# (e.g. when VCGA runs as an external component or before trust stack boots).
server {
    listen 3004;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Static web wallet UI
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to VCGA trust registry via Docker internal network
    location /v1/mimoto/ {
        set $vcga_upstream vcga:80;
        proxy_pass http://$vcga_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Direct proxy to VCGA governance catalog
    location /vcga/ {
        set $vcga_upstream vcga:80;
        proxy_pass http://$vcga_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
