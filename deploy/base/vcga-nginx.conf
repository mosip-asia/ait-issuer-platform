server {
    listen 80;
    server_name localhost;

    # Global CORS headers for wallet clients
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Serve issuer list and configuration
    location ~* ^/v1/mimoto/issuers(/.*)?$ {
        default_type application/json;
        alias /usr/share/nginx/html/installation/mimoto-issuers-config.json;
    }

    location ~* ^/issuers(/.*)?$ {
        default_type application/json;
        alias /usr/share/nginx/html/installation/mimoto-issuers-config.json;
    }

    # Serve trusted verifiers list
    location ~* ^/v1/mimoto/trusted-verifiers(/.*)?$ {
        default_type application/json;
        alias /usr/share/nginx/html/local/mimoto-trusted-verifiers.json;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }
}
