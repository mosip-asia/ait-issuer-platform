server {
    listen 80;
    server_name localhost;

    # Global CORS headers for wallet clients
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Serve trusted issuer list
    location ~* ^/(v1/mimoto/)?issuers(/.*)?$ {
        default_type application/json;
        alias /usr/share/nginx/html/vcga/issuers.json;
    }

    location = /issuers.json {
        default_type application/json;
        alias /usr/share/nginx/html/vcga/issuers.json;
    }

    location = /mimoto-issuers-config.json {
        default_type application/json;
        alias /usr/share/nginx/html/vcga/issuers.json;
    }

    # Serve trusted verifiers list
    location ~* ^/(v1/mimoto/)?(trusted-)?verifiers(/.*)?$ {
        default_type application/json;
        alias /usr/share/nginx/html/base-vcga/trusted-verifiers.json;
    }

    location = /verifiers.json {
        default_type application/json;
        alias /usr/share/nginx/html/base-vcga/trusted-verifiers.json;
    }

    location = /trusted-verifiers.json {
        default_type application/json;
        alias /usr/share/nginx/html/base-vcga/trusted-verifiers.json;
    }

    location = /mimoto-trusted-verifiers.json {
        default_type application/json;
        alias /usr/share/nginx/html/base-vcga/trusted-verifiers.json;
    }

    # Serve trusted VCGA governance registries list
    location ~* ^/(v1/mimoto/)?trusted-vcgas(/.*)?$ {
        default_type application/json;
        alias /usr/share/nginx/html/base-vcga/trusted-vcgas.json;
    }

    location = /trusted-vcgas.json {
        default_type application/json;
        alias /usr/share/nginx/html/base-vcga/trusted-vcgas.json;
    }

    # Serve mobile issuers list
    location ~* ^/(v1/mimoto/)?issuers-mobile(/.*)?$ {
        default_type application/json;
        alias /usr/share/nginx/html/base-vcga/issuers-mobile.json;
    }

    location = /issuers-mobile.json {
        default_type application/json;
        alias /usr/share/nginx/html/base-vcga/issuers-mobile.json;
    }

    location = /mimoto-issuers-mobile.json {
        default_type application/json;
        alias /usr/share/nginx/html/base-vcga/issuers-mobile.json;
    }

    location / {
        root /usr/share/nginx/html/vcga;
        try_files $uri $uri/ =404;
    }
}
