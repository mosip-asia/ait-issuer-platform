# Mimoto 0.21's bootstrap settings, shared by every Installation. Used by compose.mimoto.yaml, local only.
#
# The template address (docs/guides/print-from-the-wallet.md, "Running it on dev"): Mimoto fetches <issuer id>-<credential type>-template.html from here at every
# print and caches nothing, so a template replaced on the VDR prints at the next print. Outside the `local` profile
# it also fetches mimoto-issuers-config.json and mimoto-trusted-verifiers.json from here, and the CBEFF schema
# (mimoto-default.properties, mosip.kernel.xsdstorage-uri). The trailing / is required.
config.server.file.storage.uri=http://vdr.localhost/templates/
# No config server runs locally; Mimoto asks this address once at startup, gets a 404 and carries on.
spring.cloud.config.uri=${config.server.file.storage.uri}
spring.cloud.config.name=mimoto,inji
spring.application.name=mimoto

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=info,health,refresh

server.port=8099
server.servlet.context-path=/v1/mimoto
# Large enough for the Location header of a redirect that carries a credential offer.
server.tomcat.max-http-response-header-size=65536

health.config.enabled=false

openapi.info.title=${spring.application.name}
openapi.info.description=${spring.application.name}
openapi.info.version=1.0
openapi.info.license.name=Mosip
openapi.info.license.url=https://docs.mosip.io/platform/license
openapi.service.servers[0].url=${mosip.api.public.url}${server.servlet.context-path}
openapi.service.servers[0].description=${spring.application.name}
openapi.group.name=${openapi.info.title}
openapi.group.paths[0]=/**
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
