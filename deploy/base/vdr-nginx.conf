server {
    listen 80;
    server_name localhost;

    # Global CORS headers for wallet and web clients
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Range' always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Serve W3C JSON-LD contexts at /contexts/
    location /contexts/ {
        alias /usr/share/nginx/html/contexts/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Serve printable Velocity HTML templates at /templates/
    location /templates/ {
        alias /usr/share/nginx/html/templates/;
        # Mimoto reads a template as ISO-8859-1 unless the response says UTF-8, so any non-ASCII text typed into a
        # template (Thai) prints garbled. nginx adds the charset to text/html (also text/xml, text/plain and
        # application/javascript); JSON and the CBEFF schema are left as they were.
        charset utf-8;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Serve base templates at /base-templates/
    location /base-templates/ {
        alias /usr/share/nginx/html/base-templates/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Serve installation brand assets at /assets/
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Serve base assets at /base-assets/
    location /base-assets/ {
        alias /usr/share/nginx/html/base-assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Fallback to installation assets for direct root queries
    location / {
        root /usr/share/nginx/html/assets;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
