name: 🧪 CI & Build

# Triggered only when cutting a release tag (v*) or via manual dispatch.
# Never runs on regular pushes or commits.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: "Push Docker images to GHCR"
        type: boolean
        default: true
      force_build:
        description: "Force rebuild of Docker images even if unchanged"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: 🧪 Host Verification Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r src/portal/requirements.txt -r src/gateway/requirements.txt tzdata typer pyyaml jinja2 cryptography python-multipart itsdangerous pypdf

      - name: 🛡️ Verify Sensitive Data Guard
        run: bash scripts/check-data-guard.sh

      - name: 🧪 Run Host Test Suite
        run: |
          python src/tools/render_mimoto_issuers_config.py
          status=0
          for t in \
            src/tools/test_generate_csv.py \
            src/tools/test_render_mimoto_issuers_config.py \
            src/verifier/test_verifier.py \
            tests/test_installations.py \
            tests/test_backgrounds_ignored.py \
            tests/test_authorization_server.py \
            tests/test_inji_web_vc_readiness.py \
            tests/test_issue_and_verify.py \
            src/portal/test_auth.py \
            src/portal/test_requests.py \
            tests/test_courses.py \
            tests/test_print_check.py \
            tests/test_parity_check.py \
            tests/test_publish_set.py \
            tests/test_adapter.py \
            src/gateway/tests/test_credential_types.py \
            src/gateway/tests/test_evaluations.py
          do
            echo "::group::$t"
            if python "$t"; then r=PASS; else r=FAIL; status=1; fi
            echo "::endgroup::"
            echo "$r $t"
          done
          exit "$status"

  build:
    name: 📦 Build & Publish Artifacts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: src/issuer/pom.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' || inputs.push == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Build Artifacts & Container Images
        env:
          CONTAINER_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          TAG="${GITHUB_REF_NAME:-latest}"
          PUSH_ARGS=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.push }}" = "true" ]; then
            PUSH_ARGS="--push"
          fi
          if [ "${{ inputs.force_build }}" = "true" ]; then
            PUSH_ARGS="$PUSH_ARGS --force"
          fi
          bash scripts/build.sh --tag "$TAG" $PUSH_ARGS

      - name: Upload Plugin JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: issuer-data-provider-plugin-${{ github.sha }}
          path: src/issuer/target/issuer-data-provider-plugin.jar
          if-no-files-found: error

      - name: Attach Plugin JAR to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" src/issuer/target/issuer-data-provider-plugin.jar --clobber || true
          fi
