# ==============================================================================
# Inji Verifier Stack Compose Manifest
# ==============================================================================
# Isolated Stack:
# - Custom AIT-branded Inji Verify UI (port 4007)
# - Inji Verify Service backend (port 9095)
# - PostgreSQL database (inji_verify) for OID4VP presentation job sessions
#
# Network: verifier-network (isolated)
# Integration: Reaches Certify/VDR via host.docker.internal / public URL
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME}-verify

networks:
  verifier-network:
    name: ${COMPOSE_PROJECT_NAME}-verify-net

services:
  ui:
    build:
      context: .
      dockerfile: src/verifier/Dockerfile
    image: ghcr.io/mosip-asia/verify-ui:local
    environment:
      - DEFAULT_TITLE=${VERIFIER_TITLE}
      - DEFAULT_THEME=ait_theme
      - DEFAULT_LANG=en
      - INTERNET_CONNECTIVITY_CHECK_ENDPOINT=https://dns.google/
      - INTERNET_CONNECTIVITY_CHECK_TIMEOUT=10000
      - OVP_QR_HEADER=INJI_OVP://payload=
      - VERIFIABLE_CLAIMS_CONFIG_URL=/assets/config.json
      - VP_SUBMISSION_SUPPORTED=false
      - CLIENT_ID=inji-verify-ui
      - CLIENT_ID_DID=${INJI_VERIFY_DID_URI}
      - DISPLAY_TIMEOUT=120000
      - VERIFY_SERVICE_API_URL=/v1/verify
    volumes:
      - ./deploy/base/verify-config.json:/usr/share/nginx/html/assets/config.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.verify.rule=Host(`verifier.localhost`) || Host(`verify.localhost`) || Host(`verifier.lan`) || Host(`verifier.dpi.ait.ac.th`) || Host(`verifer.dpi.ait.ac.th`)"
      - "traefik.http.services.verify.loadbalancer.server.port=8000"
    depends_on:
      - service
    networks:
      verifier-network:
        aliases:
          - verify-ui
          - verifier.dpi.ait.ac.th
          - verifer.dpi.ait.ac.th

  service:
    image: injistack/inji-verify-service:0.17.0
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "vdr.localhost:host-gateway"
      - "cdn.localhost:host-gateway"
      - "vcga.localhost:host-gateway"
      - "issuer.localhost:host-gateway"
      - "verifier.localhost:host-gateway"
      - "wallet.localhost:host-gateway"
      - "auth.localhost:host-gateway"
      - "vdr.dpi.ait.ac.th:host-gateway"
      - "cdn.dpi.ait.ac.th:host-gateway"
      - "vcga.dpi.ait.ac.th:host-gateway"
      - "issuer.dpi.ait.ac.th:host-gateway"
      - "verifier.dpi.ait.ac.th:host-gateway"
      - "verifer.dpi.ait.ac.th:host-gateway"
      - "wallet.dpi.ait.ac.th:host-gateway"
    environment:
      - active_profile_env=default
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_NAME=inji_verify
      - DATABASE_SCHEMA=verify
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - INJI_VP_REQUEST_LONG_POLLING_TIMEOUT=55000
      - INJI_VP_SUBMISSION_BASE_URL=${INJI_VERIFY_PUBLIC_BASE_URL}/v1/verify
      - INJI_DID_VERIFY_URI=${INJI_VERIFY_DID_URI}
      - INJI_DID_VERIFY_PUBLIC_KEY_URI=${INJI_VERIFY_DID_PUBLIC_KEY_URI}
      - INJI_KEYSTORE_FILE_PASS=mosip
      - INJI_VERIFY_REDIRECT_URI=${INJI_VERIFY_REDIRECT_URI}
      - INJI_VERIFY_CLAIMS_WITH_META_DATA=_sd,_sd_alg,iss,cnf,sub,aud,exp,nbf,iat,cti
    depends_on:
      database:
        condition: service_healthy
    networks:
      verifier-network:
        aliases:
          - verify-service

  database:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./deploy/base/verify_init.sql:/docker-entrypoint-initdb.d/verify_init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "inji_verify"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks:
      - verifier-network
