# ==============================================================================
# Trust Registry Stack Compose Manifest (VDR & VCGA)
# ==============================================================================
# Isolated Stack:
# - VDR: Static Nginx CDN serving W3C JSON-LD contexts, templates, and brand assets
# - VCGA: Static Nginx serving issuer registry and trusted verifiers metadata
#
# Network: trust-network (isolated)
# Integration: Reached by Certify/Wallets/Verifiers via domain ingress / host-gateway
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME}-trust

networks:
  trust-network:
    name: ${COMPOSE_PROJECT_NAME}-trust-net

services:
  vdr:
    image: nginx:stable
    restart: unless-stopped
    volumes:
      - ./deploy/base/vdr-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/${INSTALLATION}/vdr/contexts:/usr/share/nginx/html/contexts:ro
      - ./deploy/${INSTALLATION}/vdr/templates:/usr/share/nginx/html/templates:ro
      - ./deploy/${INSTALLATION}/vdr/assets:/usr/share/nginx/html/assets:ro
      - ./deploy/base/vdr/assets:/usr/share/nginx/html/base-assets:ro
      - ./deploy/base/vdr/templates:/usr/share/nginx/html/base-templates:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vdr.rule=Host(`vdr.localhost`) || Host(`vdr.lan`) || Host(`vdr.dpi.ait.ac.th`) || Host(`vdr.ait.ac.th`)"
      - "traefik.http.services.vdr.loadbalancer.server.port=80"
    networks:
      trust-network:
        aliases:
          - vdr.dpi.ait.ac.th
          - vdr.ait.ac.th
          - vdr

  vcga:
    image: nginx:stable
    restart: unless-stopped
    volumes:
      - ./deploy/base/vcga-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/${INSTALLATION}/vcga:/usr/share/nginx/html/vcga:ro
      - ./deploy/base/vcga:/usr/share/nginx/html/base-vcga:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vcga.rule=Host(`vcga.localhost`) || Host(`vcga.lan`) || Host(`vcga.dpi.ait.ac.th`) || Host(`vcga.ait.ac.th`)"
      - "traefik.http.services.vcga.loadbalancer.server.port=80"
    networks:
      trust-network:
        aliases:
          - vcga.dpi.ait.ac.th
          - vcga.ait.ac.th
          - vcga
