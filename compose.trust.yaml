# ==============================================================================
# Trust Registry Stack Compose Manifest (VDR, VCGA & CDN)
# ==============================================================================
# Isolated Stack:
# - VDR: Static Nginx serving W3C JSON-LD contexts (port 9098)
# - VCGA: Static Nginx serving issuer registry and trusted verifiers metadata (port 9099)
# - CDN: Static Nginx serving branding logos and visual assets (port 9097)
#
# Network: trust-network (isolated)
# Integration: Reached by Certify/Wallets/Verifiers via public URLs / host ports
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME}-trust

networks:
  trust-network:
    name: ${COMPOSE_PROJECT_NAME}-trust-net

services:
  vdr:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "${VDR_PORT}:80"
    volumes:
      - ./deploy/${INSTALLATION}/contexts:/usr/share/nginx/html/contexts:ro
    networks:
      trust-network:
        aliases:
          - vdr.dpi.ait.ac.th
          - vdr.ait.ac.th
          - vdr

  vcga:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "${VCGA_PORT}:80"
    volumes:
      - ./deploy/base/vcga-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/${INSTALLATION}:/usr/share/nginx/html/installation:ro
      - ./deploy/base:/usr/share/nginx/html/base:ro
    networks:
      trust-network:
        aliases:
          - vcga.dpi.ait.ac.th
          - vcga.ait.ac.th
          - vcga

  cdn:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "${CDN_PORT}:80"
    volumes:
      - ./deploy/base/cdn-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/${INSTALLATION}/assets:/usr/share/nginx/html/assets:ro
      - ./deploy/base/assets:/usr/share/nginx/html/base-assets:ro
    networks:
      trust-network:
        aliases:
          - cdn.dpi.ait.ac.th
          - cdn.ait.ac.th
          - cdn
